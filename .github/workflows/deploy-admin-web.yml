name: Deploy Admin Web to Vercel

on:
  push:
    branches: [main]
    paths:
      - "apps/admin-web/**"
      - "packages/shared-types/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-admin-web.yml"

concurrency:
  group: crewith-admin-web-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @crewith/admin-web
      - run: npm run build -w @crewith/admin-web
      - name: Pull Vercel production settings
        run: npx --yes vercel@56.4.1 pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}" --cwd apps/admin-web
      - name: Build Vercel output
        run: npx --yes vercel@56.4.1 build --prod --token="${{ secrets.VERCEL_TOKEN }}" --cwd apps/admin-web
      - name: Deploy prebuilt output
        run: npx --yes vercel@56.4.1 deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}" --cwd apps/admin-web
