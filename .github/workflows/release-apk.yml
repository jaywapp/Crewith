name: Release Android APK

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile-app/**"
      - ".github/workflows/release-apk.yml"

concurrency:
  group: crewith-android-release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.3"
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: apps/mobile-app
        run: flutter pub get
      - name: Analyze
        working-directory: apps/mobile-app
        run: flutter analyze
      - name: Test
        working-directory: apps/mobile-app
        run: flutter test
      - name: Read release version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version:[[:space:]]*//p' apps/mobile-app/pubspec.yaml)"
          version_name="${version%%+*}"
          test -n "$version_name"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "tag=v$version_name" >> "$GITHUB_OUTPUT"
      - name: Reject an existing release version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if git rev-parse --verify --quiet "refs/tags/$TAG" || gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Update pubspec.yaml before merging to main."
            exit 1
          fi
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > apps/mobile-app/android/app/crewith-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=crewith-release.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" \
            > apps/mobile-app/android/key.properties
      - name: Build signed release APK
        working-directory: apps/mobile-app
        env:
          API_BASE_URL: ${{ vars.CREWITH_API_BASE_URL }}
          APP_VERSION: ${{ steps.version.outputs.name }}
        shell: bash
        run: |
          test -n "$API_BASE_URL"
          flutter build apk --release \
            --dart-define="CREWITH_API_BASE_URL=$API_BASE_URL" \
            --dart-define="CREWITH_APP_VERSION=$APP_VERSION"
      - name: Verify and rename APK
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.name }}
        shell: bash
        run: |
          source_apk="apps/mobile-app/build/app/outputs/flutter-apk/app-release.apk"
          target_apk="apps/mobile-app/build/app/outputs/flutter-apk/crewith-$VERSION-release.apk"
          test -s "$source_apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$source_apk"
          cp "$source_apk" "$target_apk"
          echo "path=$target_apk" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.name }}
          APK: ${{ steps.apk.outputs.path }}
        shell: bash
        run: gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Crewith Android $VERSION" --generate-notes --latest
